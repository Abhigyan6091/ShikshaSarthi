# ─── ShikshaSarthi – Nginx configuration ────────────────────────────────────
# Serves the built frontend as static files and proxies API calls to the
# Node.js backend running on port 5000.
#
# In docker-compose the backend hostname is "backend"; in a single container
# it is "127.0.0.1".  Override via env variable BACKEND_HOST if needed.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Backend upstream ──
  # Single container: backend runs on 127.0.0.1:5000.
  # Override via env BACKEND_HOST / BACKEND_PORT.
  resolver 127.0.0.11 ipv6=off valid=30s;
  set $backend_upstream "http://${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-5000}";

  server {
    listen 80 default_server;
    server_name _;

    # ── Static frontend ──
    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # ── API reverse proxy ──
    location /api/ {
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 100m;
    }

    # ── VQG proxy (served through backend which proxies to FastAPI) ──
    location /vqg/ {
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      client_max_body_size 500m;
      proxy_read_timeout 300s;
    }

    # ── Backend routes not under /api/ ──
    location ~ ^/(questions|quizzes|students|teachers|reports|schools|vocab|
                   superadmin|schooladmin|classes|video-questions|audio-questions|
                   puzzles|sync|media|uploads|videos|hi|app/version|$) {
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 100m;
    }

    # ── Static assets (with fingerprint – long cache) ──
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback – serve index.html for any unmatched path ──
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
