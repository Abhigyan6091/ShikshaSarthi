<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShikshaSarthi Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #818cf8;
            --primary-dark: #4f46e5;
            --accent: #a855f7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #f43f5e;
            --panel: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-user-select: none;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background: var(--panel);
            border: 2px solid var(--card-border);
            border-radius: 2rem;
            padding: 3.5rem;
            box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.6);
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .role-tag {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            padding: 0.5rem 1.25rem;
            background: #1e1b4b;
            border: 1px solid var(--primary);
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--primary);
            text-transform: uppercase;
        }

        .header {
            text-align: left;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.15rem;
            font-weight: 400;
            margin-top: -0.5rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2.5rem;
            align-items: start;
        }

        .status-section {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.75rem;
            border-radius: 1.5rem;
        }

        .label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
        }

        .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .status-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.25rem;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 4px;
            background: #334155;
        }

        .indicator.active {
            background: var(--success);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .indicator.starting {
            background: #f59e0b;
            animation: pulse 1.5s infinite;
        }

        .indicator.error {
            background: var(--error);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .item-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .action-section {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .instruction {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .launch-btn {
            padding: 1.5rem;
            background: var(--primary-dark);
            border: none;
            border-radius: 1.25rem;
            color: white;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            box-shadow: 0 4px 0px #3730a3;
            margin-top: auto;
        }

        .launch-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 0px #3730a3;
        }

        .launch-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0px #3730a3;
        }

        .footer {
            margin-top: 1rem;
            padding-top: 2rem;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="role-tag" class="role-tag">Loading...</div>
        
        <div class="header">
            <h1 class="logo">ShikshaSarthi</h1>
            <p id="role-subtitle" class="subtitle">Platform Status Console</p>
        </div>

        <div class="main-layout">
            <div class="status-section">
                <div class="info-card">
                    <span class="label">Classroom Access Address</span>
                    <div id="server-url" class="value">0.0.0.0:6091</div>
                </div>

                <div class="status-grid">
                    <div class="status-item">
                        <div id="docker-status" class="indicator starting"></div>
                        <span class="item-label">Server</span>
                    </div>
                    <div class="status-item">
                        <div id="ts-status" class="indicator"></div>
                        <span class="item-label">Tailscale</span>
                    </div>
                    <div class="status-item">
                        <div id="lan-status" class="indicator active"></div>
                        <span class="item-label">Wi-Fi LAN</span>
                    </div>
                </div>
            </div>

            <div class="action-section">
                <p id="instruction-text" class="instruction">
                    Starting local services. Please wait...
                </p>

                <button id="launch-btn" class="launch-btn" style="opacity: 0.6; cursor: not-allowed;" disabled>
                    <span>Open Dashboard</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </button>
            </div>
        </div>

        <div class="footer">
            <span>Powered by Anthropic</span>
            <span>SHIKSHASARTHI V2.2-STABLE</span>
        </div>
    </div>

    <script>
        const serverUrl = document.getElementById('server-url');
        const roleTag = document.getElementById('role-tag');
        const roleSubtitle = document.getElementById('role-subtitle');
        const dockerStatus = document.getElementById('docker-status');
        const tsStatus = document.getElementById('ts-status');
        const instructionText = document.getElementById('instruction-text');
        const launchBtn = document.getElementById('launch-btn');

        let currentUrl = 'http://localhost:6091';

        async function init() {
            const info = await window.electronAPI.getServerInfo();
            
            // Set Role
            roleTag.textContent = info.role;
            if (info.role === 'MASTER') {
                roleSubtitle.textContent = 'Hub Management Console';
                instructionText.textContent = 'Ready for content management. Use the button below to access your master tools.';
            } else {
                roleSubtitle.textContent = 'School Node Console';
                instructionText.textContent = `Ensure student devices are on the same WiFi network and use the address shown on the left.`;
            }

            // Set URL
            currentUrl = `http://${info.ip}:${info.port}`;
            serverUrl.textContent = info.ip + ':' + info.port;

            // Tailscale status
            if (info.tailscale) {
                tsStatus.className = 'indicator active';
            } else {
                tsStatus.className = 'indicator';
            }
        }

        window.electronAPI.onDockerStatus((status) => {
            if (status === 'running') {
                dockerStatus.className = 'indicator active';
                launchBtn.disabled = false;
                launchBtn.style.opacity = '1';
                launchBtn.style.cursor = 'pointer';
            } else if (status === 'error') {
                dockerStatus.className = 'indicator error';
                instructionText.textContent = 'Critical Error: Docker services failed. Verify Docker Desktop is running.';
                launchBtn.style.opacity = '0.4';
            }
        });

        launchBtn.addEventListener('click', () => {
            window.electronAPI.openExternal(currentUrl);
        });

        init();
    </script>
</body>

</html>
