name: ShikshaSarthi Desktop & Hub CI/CD

on:
  push:
    branches: [ main, deployment-updates ]
  workflow_dispatch:

jobs:
  # 1. Build and Test the Application
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Build Frontend
        run: npm run build

  # 2. Build Docker Images and Ship to Registry
  ship-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Lean Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.lean
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shikshasarthi:latest

  # 3. Build Desktop Application (Windows)
  build-desktop:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: shikshasarthi-launcher/desktop-wrapper/package-lock.json

      - name: Install Desktop Dependencies
        run: |
          cd shikshasarthi-launcher/desktop-wrapper
          npm install

      - name: Build Windows Executable
        run: |
          cd shikshasarthi-launcher/desktop-wrapper
          npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaSarthi-Windows
          path: shikshasarthi-launcher/desktop-wrapper/dist/*.exe

  # 4. Update the Master Hub Manifest over Tailscale
  update-hub-manifest:
    needs: ship-docker
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Push Version Update to Hub
        run: |
          # Generate version string based on date and run number
          VERSION=$(date +'%Y.%m.%d').${{ github.run_number }}
          API_KEY=${{ secrets.UPDATE_API_KEY }}
          
          echo "Attempting to notify hub at 100.111.94.52:6091..."
          
          # --max-time 30: abort if no response in 30s
          # --retry 3: retry up to 3 times on transient failures
          if curl -f --max-time 30 --retry 3 --retry-delay 5 \
               -X POST "http://100.111.94.52:6091/api/updates/publish" \
               -H "Content-Type: application/json" \
               -d "{\"version\": \"$VERSION\", \"apiKey\": \"$API_KEY\", \"releaseNotes\": \"Automated update from GitHub Actions\"}"; then
            echo "✅ Hub manifest updated to version $VERSION"
          else
            echo "⚠️  Could not reach hub on port 6091. Docker image is already pushed."
            echo "   ACTION REQUIRED: SSH into 100.111.94.52 and run:"
            echo "   cd /path/to/shikshasarthi-launcher && docker compose down && docker compose up -d"
            exit 0
          fi
