name: ShikshaSarthi Desktop & Hub CI/CD

on:
  push:
    branches: [ main, deployment-updates ]
  workflow_dispatch:

jobs:
  # 1. Build and Test the Application
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Build Frontend
        run: npm run build

  # 2. Build Docker Images and Ship to Registry
  ship-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Lean Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.lean
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shikshasarthi:latest

  # 3. Update the Master Hub Manifest over Tailscale
  update-hub-manifest:
    needs: ship-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Push Version Update to Hub
        run: |
          # Generate version string based on date and run number
          VERSION=$(date +'%Y.%m.%d').${{ github.run_number }}
          API_KEY=${{ secrets.UPDATE_API_KEY }}
          
          # Use your Master Hub Tailscale IP (default 100.111.94.52)
          # This endpoint was implemented in /api/updates/publish
          curl -f -X POST "http://100.111.94.52:6091/api/updates/publish" \
               -H "Content-Type: application/json" \
               -d "{\"version\": \"$VERSION\", \"apiKey\": \"$API_KEY\", \"releaseNotes\": \"Automated update from GitHub Actions\"}"
