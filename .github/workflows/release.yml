name: Release ShikshaSarthi

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix"
        required: true
        type: string
      channel:
        description: "Update channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "20"
  RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}

jobs:
  build-web-and-update:
    name: Build web update package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_name: ${{ steps.package.outputs.package_name }}
      manifest_name: aws-update-manifest.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm version "$VERSION" --no-git-tag-version
          npm --prefix backend version "$VERSION" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /.
          VITE_CLOUDINARY_ENABLED: "false"

      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ vars.AWS_SCHOOL_DATA_BUCKET != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Install backend dependencies
        if: ${{ vars.AWS_SCHOOL_DATA_BUCKET != '' }}
        working-directory: backend
        run: npm ci --omit=dev

      - name: Refresh school seed from AWS cloud-sync
        if: ${{ vars.AWS_SCHOOL_DATA_BUCKET != '' }}
        shell: bash
        run: |
          node backend/scripts/buildSeedFromCloudSync.js \
            "${{ vars.AWS_SCHOOL_DATA_BUCKET }}" \
            "${{ vars.AWS_SYNC_SCOPE || 'global' }}" \
            backend/data/school-seed.ejson
          aws s3 cp backend/data/school-seed.ejson \
            "s3://${{ vars.AWS_SCHOOL_DATA_BUCKET }}/seeds/current/school-seed.ejson"

      - name: Build update bundle
        id: package
        run: |
          scripts/package-update-bundle.sh "${{ steps.version.outputs.version }}"
          echo "package_name=shiksha-sarthi-update-${{ steps.version.outputs.version }}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiksha-sarthi-update-${{ steps.version.outputs.version }}
          path: |
            dist-release/shiksha-sarthi-update-${{ steps.version.outputs.version }}.zip
            dist-release/shiksha-sarthi-update-${{ steps.version.outputs.version }}.zip.sha256
            dist-release/aws-update-manifest.json

  build-desktop-windows:
    name: Build Windows exe
    runs-on: windows-latest
    needs: build-web-and-update
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shikshasarthi-launcher/desktop-wrapper/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /.
          VITE_CLOUDINARY_ENABLED: "false"

      - name: Install desktop dependencies
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npm ci

      - name: Stamp desktop version
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npm version "${{ needs.build-web-and-update.outputs.version }}" --no-git-tag-version

      - name: Prepare bundled app resources
        run: node scripts/prepare-desktop-resources.cjs

      - name: Download MongoDB runtime
        run: node scripts/download-mongodb-runtime.cjs

      - name: Download Visual C++ runtime for installer
        run: node scripts/download-vc-redist.cjs

      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ (vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai') != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Download current school seed from S3
        if: ${{ (vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai') != '' }}
        shell: bash
        run: |
          mkdir -p shikshasarthi-launcher/desktop-wrapper/launcher-data/backend/data
          aws s3 cp "s3://${{ vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai' }}/seeds/current/school-seed.ejson" \
            "shikshasarthi-launcher/desktop-wrapper/launcher-data/backend/data/school-seed.ejson"

      - name: Write live AWS config into bundled .env
        if: ${{ vars.AWS_CONTROL_API_URL != '' }}
        shell: bash
        env:
          ENV_AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          ENV_AWS_CONTROL_API_URL: ${{ vars.AWS_CONTROL_API_URL }}
          ENV_AWS_CONTROL_API_KEY: ${{ secrets.AWS_CONTROL_API_KEY }}
          ENV_AWS_SCHOOL_ID: ${{ vars.AWS_SCHOOL_ID || 'SCHOOL001' }}
          ENV_AWS_UPDATES_BUCKET: ${{ vars.AWS_UPDATES_BUCKET }}
          ENV_AWS_SCHOOL_DATA_BUCKET: ${{ vars.AWS_SCHOOL_DATA_BUCKET }}
        run: |
          ENV_FILE="shikshasarthi-launcher/desktop-wrapper/launcher-data/.env"
          cp shikshasarthi-launcher/desktop-wrapper/launcher-data/.env.local-school.example "$ENV_FILE"
          node scripts/write-desktop-env.cjs "$ENV_FILE"

      - name: Generate desktop icons
        run: node scripts/create-desktop-icons.cjs

      - name: Build exe
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaSarthi-Windows-${{ needs.build-web-and-update.outputs.version }}
          path: shikshasarthi-launcher/desktop-wrapper/dist/*.exe

  build-desktop-linux:
    name: Build Linux deb
    runs-on: ubuntu-latest
    needs: build-web-and-update
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shikshasarthi-launcher/desktop-wrapper/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /.
          VITE_CLOUDINARY_ENABLED: "false"

      - name: Install desktop dependencies
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npm ci

      - name: Stamp desktop version
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npm version "${{ needs.build-web-and-update.outputs.version }}" --no-git-tag-version

      - name: Prepare bundled app resources
        run: node scripts/prepare-desktop-resources.cjs

      - name: Download MongoDB runtime
        run: node scripts/download-mongodb-runtime.cjs

      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ (vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai') != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Download current school seed from S3
        if: ${{ (vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai') != '' }}
        shell: bash
        run: |
          mkdir -p shikshasarthi-launcher/desktop-wrapper/launcher-data/backend/data
          aws s3 cp "s3://${{ vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai' }}/seeds/current/school-seed.ejson" \
            "shikshasarthi-launcher/desktop-wrapper/launcher-data/backend/data/school-seed.ejson"

      - name: Write live AWS config into bundled .env
        if: ${{ vars.AWS_CONTROL_API_URL != '' }}
        shell: bash
        env:
          ENV_AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          ENV_AWS_CONTROL_API_URL: ${{ vars.AWS_CONTROL_API_URL }}
          ENV_AWS_CONTROL_API_KEY: ${{ secrets.AWS_CONTROL_API_KEY }}
          ENV_AWS_SCHOOL_ID: ${{ vars.AWS_SCHOOL_ID || 'SCHOOL001' }}
          ENV_AWS_UPDATES_BUCKET: ${{ vars.AWS_UPDATES_BUCKET }}
          ENV_AWS_SCHOOL_DATA_BUCKET: ${{ vars.AWS_SCHOOL_DATA_BUCKET }}
        run: |
          ENV_FILE="shikshasarthi-launcher/desktop-wrapper/launcher-data/.env"
          cp shikshasarthi-launcher/desktop-wrapper/launcher-data/.env.local-school.example "$ENV_FILE"
          node scripts/write-desktop-env.cjs "$ENV_FILE"

      - name: Generate desktop icons
        run: node scripts/create-desktop-icons.cjs

      - name: Build deb
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npx electron-builder --linux deb --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaSarthi-Linux-${{ needs.build-web-and-update.outputs.version }}
          path: shikshasarthi-launcher/desktop-wrapper/dist/*.deb

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-web-and-update
      - build-desktop-windows
      - build-desktop-linux
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true

  publish-aws:
    name: Publish AWS update package
    runs-on: ubuntu-latest
    needs:
      - build-web-and-update
      - build-desktop-windows
      - build-desktop-linux
    if: ${{ vars.AWS_UPDATES_BUCKET != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shiksha-sarthi-update-${{ needs.build-web-and-update.outputs.version }}
          path: dist-release

      - uses: actions/download-artifact@v4
        with:
          name: ShikshaSarthi-Windows-${{ needs.build-web-and-update.outputs.version }}
          path: desktop-artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: ShikshaSarthi-Linux-${{ needs.build-web-and-update.outputs.version }}
          path: desktop-artifacts/linux

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Upload package and manifest to S3
        shell: bash
        run: |
          VERSION="${{ needs.build-web-and-update.outputs.version }}"
          CHANNEL="${{ env.RELEASE_CHANNEL }}"
          BUCKET="${{ vars.AWS_UPDATES_BUCKET }}"
          WINDOWS_INSTALLER="$(find desktop-artifacts/windows -name '*.exe' -type f | head -n 1)"
          LINUX_INSTALLER="$(find desktop-artifacts/linux -name '*.deb' -type f | head -n 1)"

          aws s3 cp "dist-release/shiksha-sarthi-update-$VERSION.zip" "s3://$BUCKET/updates/$CHANNEL/shiksha-sarthi-update-$VERSION.zip"
          aws s3 cp "dist-release/shiksha-sarthi-update-$VERSION.zip.sha256" "s3://$BUCKET/updates/$CHANNEL/shiksha-sarthi-update-$VERSION.zip.sha256"
          aws s3 cp "dist-release/aws-update-manifest.json" "s3://$BUCKET/updates/$CHANNEL/manifest.json"
          aws s3 cp "$WINDOWS_INSTALLER" "s3://$BUCKET/installers/$CHANNEL/windows/ShikshaSarthi-$VERSION.exe"
          aws s3 cp "$LINUX_INSTALLER" "s3://$BUCKET/installers/$CHANNEL/linux/ShikshaSarthi-$VERSION.deb"

      - name: Publish version record to control plane
        if: ${{ vars.AWS_CONTROL_API_URL != '' }}
        shell: bash
        env:
          CONTROL_API_URL: ${{ vars.AWS_CONTROL_API_URL }}
          CONTROL_API_KEY: ${{ secrets.AWS_CONTROL_API_KEY }}
        run: |
          VERSION="${{ needs.build-web-and-update.outputs.version }}"
          CHANNEL="${{ env.RELEASE_CHANNEL }}"
          SHA256="$(cut -d ' ' -f1 < "dist-release/shiksha-sarthi-update-$VERSION.zip.sha256")"
          PAYLOAD=$(cat <<JSON
          {
            "version": "$VERSION",
            "channel": "$CHANNEL",
            "packageKey": "updates/$CHANNEL/shiksha-sarthi-update-$VERSION.zip",
            "packageSha256": "$SHA256",
            "manifestKey": "updates/$CHANNEL/manifest.json",
            "windowsInstallerKey": "installers/$CHANNEL/windows/ShikshaSarthi-$VERSION.exe",
            "linuxInstallerKey": "installers/$CHANNEL/linux/ShikshaSarthi-$VERSION.deb"
          }
          JSON
          )
          curl -fsSL -X POST "$CONTROL_API_URL/version/publish" \
            -H "content-type: application/json" \
            -H "x-api-key: $CONTROL_API_KEY" \
            -d "$PAYLOAD"
