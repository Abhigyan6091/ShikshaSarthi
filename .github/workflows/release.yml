name: Release ShikshaSarthi

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix"
        required: true
        type: string
      channel:
        description: "Update channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "20"
  RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}

# This workflow intentionally never uses actions/upload-artifact or
# actions/download-artifact for the release binaries. Each build job uploads
# its own output straight to S3 and appends it directly to the GitHub Release
# (via softprops/action-gh-release). GitHub Actions' artifact storage has a
# small quota that isn't meant for permanent hosting; routing multi-hundred-MB
# installers through it (build job -> artifact -> publish job -> S3/Release)
# previously exhausted that quota and broke releases. Publishing directly from
# each build job removes that hop entirely, and your download location for
# users is unchanged: the GitHub Releases page and the S3 install buckets.

jobs:
  build-web-and-update:
    name: Build web update package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      app_bundle_sha256: ${{ steps.package.outputs.app_bundle_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm --prefix backend version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /.
          VITE_CLOUDINARY_ENABLED: "false"

      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ vars.AWS_SCHOOL_DATA_BUCKET != '' || vars.AWS_UPDATES_BUCKET != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Install backend dependencies
        if: ${{ vars.AWS_SCHOOL_DATA_BUCKET != '' }}
        working-directory: backend
        run: npm ci --omit=dev

      - name: Refresh school seed from AWS cloud-sync
        if: ${{ vars.AWS_SCHOOL_DATA_BUCKET != '' }}
        shell: bash
        run: |
          node backend/scripts/buildSeedFromCloudSync.js \
            "${{ vars.AWS_SCHOOL_DATA_BUCKET }}" \
            "${{ vars.AWS_SYNC_SCOPE || 'global' }}" \
            backend/data/school-seed.ejson
          aws s3 cp backend/data/school-seed.ejson \
            "s3://${{ vars.AWS_SCHOOL_DATA_BUCKET }}/seeds/current/school-seed.ejson"

      - name: Build update bundle
        id: package
        shell: bash
        run: |
          scripts/package-update-bundle.sh "${{ steps.version.outputs.version }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "package_sha256=$(cut -d ' ' -f1 < "dist-release/shiksha-sarthi-update-$VERSION.zip.sha256")" >> "$GITHUB_OUTPUT"
          echo "app_bundle_sha256=$(cut -d ' ' -f1 < "dist-release/shiksha-sarthi-app-$VERSION.zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload update package to S3
        if: ${{ vars.AWS_UPDATES_BUCKET != '' }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ env.RELEASE_CHANNEL }}"
          BUCKET="${{ vars.AWS_UPDATES_BUCKET }}"
          aws s3 cp "dist-release/shiksha-sarthi-update-$VERSION.zip" "s3://$BUCKET/updates/$CHANNEL/shiksha-sarthi-update-$VERSION.zip"
          aws s3 cp "dist-release/shiksha-sarthi-update-$VERSION.zip.sha256" "s3://$BUCKET/updates/$CHANNEL/shiksha-sarthi-update-$VERSION.zip.sha256"
          aws s3 cp "dist-release/aws-update-manifest.json" "s3://$BUCKET/updates/$CHANNEL/manifest.json"
          aws s3 cp "dist-release/shiksha-sarthi-app-$VERSION.zip" "s3://$BUCKET/app-bundles/$CHANNEL/shiksha-sarthi-app-$VERSION.zip"
          aws s3 cp "dist-release/shiksha-sarthi-app-$VERSION.zip.sha256" "s3://$BUCKET/app-bundles/$CHANNEL/shiksha-sarthi-app-$VERSION.zip.sha256"

      # Creates the GitHub Release (first job to touch it) and attaches the web
      # bundle. build-desktop-windows/linux append their own installer to this
      # same release once it exists, so there is no artifact hand-off.
      - name: Publish release with web bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/shiksha-sarthi-update-${{ steps.version.outputs.version }}.zip
            dist-release/shiksha-sarthi-update-${{ steps.version.outputs.version }}.zip.sha256
            dist-release/aws-update-manifest.json
            dist-release/shiksha-sarthi-app-${{ steps.version.outputs.version }}.zip
            dist-release/shiksha-sarthi-app-${{ steps.version.outputs.version }}.zip.sha256

  build-desktop-windows:
    name: Build Windows exe
    runs-on: windows-latest
    needs: build-web-and-update
    outputs:
      installer_sha256: ${{ steps.build.outputs.installer_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shikshasarthi-launcher/desktop-wrapper/package-lock.json

      - name: Stamp app and backend version
        shell: bash
        run: |
          npm version "${{ needs.build-web-and-update.outputs.version }}" --no-git-tag-version --allow-same-version
          npm --prefix backend version "${{ needs.build-web-and-update.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install web dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /.
          VITE_CLOUDINARY_ENABLED: "false"

      - name: Install desktop dependencies
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npm ci

      - name: Stamp desktop version
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npm version "${{ needs.build-web-and-update.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Prepare bundled app resources
        run: node scripts/prepare-desktop-resources.cjs

      - name: Verify bundled app resources
        shell: bash
        run: |
          VERSION="${{ needs.build-web-and-update.outputs.version }}"
          export VERSION
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const expected = process.env.VERSION;
          const root = path.join('shikshasarthi-launcher', 'desktop-wrapper', 'launcher-data');
          const files = ['package.json', 'backend/package.json', 'shikshasarthi-launcher/desktop-wrapper/package.json'];
          for (const file of files) {
            const pkg = require(path.resolve(root, file));
            if (pkg.version !== expected) {
              throw new Error(`${file} is ${pkg.version}, expected ${expected}`);
            }
          }
          for (const file of ['dist/index.html', 'backend/index.js', 'release-baseline.json']) {
            if (!fs.existsSync(path.join(root, file))) {
              throw new Error(`Missing bundled resource: ${file}`);
            }
          }
          NODE

      - name: Download MongoDB runtime
        run: node scripts/download-mongodb-runtime.cjs

      - name: Cache Visual C++ runtime
        uses: actions/cache@v4
        with:
          path: shikshasarthi-launcher/desktop-wrapper/launcher-data/vc_redist.x64.exe
          key: vc-redist-x64-2015-2022-v1

      - name: Download Visual C++ runtime for installer
        run: node scripts/download-vc-redist.cjs

      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ (vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai') != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Download current school seed from S3
        if: ${{ (vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai') != '' }}
        shell: bash
        run: |
          mkdir -p shikshasarthi-launcher/desktop-wrapper/launcher-data/backend/data
          aws s3 cp "s3://${{ vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai' }}/seeds/current/school-seed.ejson" \
            "shikshasarthi-launcher/desktop-wrapper/launcher-data/backend/data/school-seed.ejson"

      - name: Write live AWS config into bundled .env
        if: ${{ vars.AWS_CONTROL_API_URL != '' }}
        shell: bash
        env:
          ENV_AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          ENV_AWS_CONTROL_API_URL: ${{ vars.AWS_CONTROL_API_URL }}
          ENV_AWS_CONTROL_API_KEY: ${{ secrets.AWS_CONTROL_API_KEY }}
          ENV_AWS_SCHOOL_ID: ${{ vars.AWS_SCHOOL_ID || 'SCHOOL001' }}
          ENV_AWS_UPDATES_BUCKET: ${{ vars.AWS_UPDATES_BUCKET }}
          ENV_AWS_SCHOOL_DATA_BUCKET: ${{ vars.AWS_SCHOOL_DATA_BUCKET }}
        run: |
          ENV_FILE="shikshasarthi-launcher/desktop-wrapper/launcher-data/.env"
          cp shikshasarthi-launcher/desktop-wrapper/launcher-data/.env.local-school.example "$ENV_FILE"
          node scripts/write-desktop-env.cjs "$ENV_FILE"

      - name: Generate desktop icons
        run: node scripts/create-desktop-icons.cjs

      - name: Build exe
        id: build
        working-directory: shikshasarthi-launcher/desktop-wrapper
        shell: bash
        run: |
          rm -rf dist
          npx electron-builder --win --publish never
          VERSION="${{ needs.build-web-and-update.outputs.version }}"
          INSTALLER="$(find dist -maxdepth 1 -name "*$VERSION*.exe" -type f | head -n 1)"
          test -n "$INSTALLER"
          echo "installer_path=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "installer_sha256=$(sha256sum "$INSTALLER" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to S3
        if: ${{ vars.AWS_UPDATES_BUCKET != '' }}
        shell: bash
        run: |
          aws s3 cp "shikshasarthi-launcher/desktop-wrapper/${{ steps.build.outputs.installer_path }}" \
            "s3://${{ vars.AWS_UPDATES_BUCKET }}/installers/${{ env.RELEASE_CHANNEL }}/windows/ShikshaSarthi-${{ needs.build-web-and-update.outputs.version }}.exe"

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: shikshasarthi-launcher/desktop-wrapper/${{ steps.build.outputs.installer_path }}

  build-desktop-linux:
    name: Build Linux deb
    runs-on: ubuntu-latest
    needs: build-web-and-update
    outputs:
      installer_sha256: ${{ steps.build.outputs.installer_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shikshasarthi-launcher/desktop-wrapper/package-lock.json

      - name: Stamp app and backend version
        shell: bash
        run: |
          npm version "${{ needs.build-web-and-update.outputs.version }}" --no-git-tag-version --allow-same-version
          npm --prefix backend version "${{ needs.build-web-and-update.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install web dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /.
          VITE_CLOUDINARY_ENABLED: "false"

      - name: Install desktop dependencies
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npm ci

      - name: Stamp desktop version
        working-directory: shikshasarthi-launcher/desktop-wrapper
        run: npm version "${{ needs.build-web-and-update.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Prepare bundled app resources
        run: node scripts/prepare-desktop-resources.cjs

      - name: Verify bundled app resources
        shell: bash
        run: |
          VERSION="${{ needs.build-web-and-update.outputs.version }}"
          export VERSION
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const expected = process.env.VERSION;
          const root = path.join('shikshasarthi-launcher', 'desktop-wrapper', 'launcher-data');
          const files = ['package.json', 'backend/package.json', 'shikshasarthi-launcher/desktop-wrapper/package.json'];
          for (const file of files) {
            const pkg = require(path.resolve(root, file));
            if (pkg.version !== expected) {
              throw new Error(`${file} is ${pkg.version}, expected ${expected}`);
            }
          }
          for (const file of ['dist/index.html', 'backend/index.js', 'release-baseline.json']) {
            if (!fs.existsSync(path.join(root, file))) {
              throw new Error(`Missing bundled resource: ${file}`);
            }
          }
          NODE

      - name: Download MongoDB runtime
        run: node scripts/download-mongodb-runtime.cjs

      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ (vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai') != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Download current school seed from S3
        if: ${{ (vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai') != '' }}
        shell: bash
        run: |
          mkdir -p shikshasarthi-launcher/desktop-wrapper/launcher-data/backend/data
          aws s3 cp "s3://${{ vars.AWS_SCHOOL_DATA_BUCKET || 'shiksha-sarthi-control-shikshaschooldatabucket-s3uqfy75e4ai' }}/seeds/current/school-seed.ejson" \
            "shikshasarthi-launcher/desktop-wrapper/launcher-data/backend/data/school-seed.ejson"

      - name: Write live AWS config into bundled .env
        if: ${{ vars.AWS_CONTROL_API_URL != '' }}
        shell: bash
        env:
          ENV_AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          ENV_AWS_CONTROL_API_URL: ${{ vars.AWS_CONTROL_API_URL }}
          ENV_AWS_CONTROL_API_KEY: ${{ secrets.AWS_CONTROL_API_KEY }}
          ENV_AWS_SCHOOL_ID: ${{ vars.AWS_SCHOOL_ID || 'SCHOOL001' }}
          ENV_AWS_UPDATES_BUCKET: ${{ vars.AWS_UPDATES_BUCKET }}
          ENV_AWS_SCHOOL_DATA_BUCKET: ${{ vars.AWS_SCHOOL_DATA_BUCKET }}
        run: |
          ENV_FILE="shikshasarthi-launcher/desktop-wrapper/launcher-data/.env"
          cp shikshasarthi-launcher/desktop-wrapper/launcher-data/.env.local-school.example "$ENV_FILE"
          node scripts/write-desktop-env.cjs "$ENV_FILE"

      - name: Generate desktop icons
        run: node scripts/create-desktop-icons.cjs

      - name: Build deb
        id: build
        working-directory: shikshasarthi-launcher/desktop-wrapper
        shell: bash
        run: |
          rm -rf dist
          npx electron-builder --linux deb --publish never
          VERSION="${{ needs.build-web-and-update.outputs.version }}"
          INSTALLER="$(find dist -maxdepth 1 -name "*$VERSION*.deb" -type f | head -n 1)"
          test -n "$INSTALLER"
          echo "installer_path=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "installer_sha256=$(sha256sum "$INSTALLER" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to S3
        if: ${{ vars.AWS_UPDATES_BUCKET != '' }}
        shell: bash
        run: |
          aws s3 cp "shikshasarthi-launcher/desktop-wrapper/${{ steps.build.outputs.installer_path }}" \
            "s3://${{ vars.AWS_UPDATES_BUCKET }}/installers/${{ env.RELEASE_CHANNEL }}/linux/ShikshaSarthi-${{ needs.build-web-and-update.outputs.version }}.deb"

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: shikshasarthi-launcher/desktop-wrapper/${{ steps.build.outputs.installer_path }}

  publish-version-record:
    name: Publish version record to control plane
    runs-on: ubuntu-latest
    needs:
      - build-web-and-update
      - build-desktop-windows
      - build-desktop-linux
    if: ${{ vars.AWS_CONTROL_API_URL != '' }}
    steps:
      - name: Publish version record
        shell: bash
        env:
          CONTROL_API_URL: ${{ vars.AWS_CONTROL_API_URL }}
          CONTROL_API_KEY: ${{ secrets.AWS_CONTROL_API_KEY }}
        run: |
          VERSION="${{ needs.build-web-and-update.outputs.version }}"
          CHANNEL="${{ env.RELEASE_CHANNEL }}"
          PAYLOAD=$(cat <<JSON
          {
            "version": "$VERSION",
            "channel": "$CHANNEL",
            "packageKey": "updates/$CHANNEL/shiksha-sarthi-update-$VERSION.zip",
            "packageSha256": "${{ needs.build-web-and-update.outputs.package_sha256 }}",
            "manifestKey": "updates/$CHANNEL/manifest.json",
            "windowsInstallerKey": "installers/$CHANNEL/windows/ShikshaSarthi-$VERSION.exe",
            "linuxInstallerKey": "installers/$CHANNEL/linux/ShikshaSarthi-$VERSION.deb",
            "windowsInstallerSha256": "${{ needs.build-desktop-windows.outputs.installer_sha256 }}",
            "linuxInstallerSha256": "${{ needs.build-desktop-linux.outputs.installer_sha256 }}",
            "appBundleKey": "app-bundles/$CHANNEL/shiksha-sarthi-app-$VERSION.zip",
            "appBundleSha256": "${{ needs.build-web-and-update.outputs.app_bundle_sha256 }}"
          }
          JSON
          )
          curl -fsSL -X POST "$CONTROL_API_URL/version/publish" \
            -H "content-type: application/json" \
            -H "x-api-key: $CONTROL_API_KEY" \
            -d "$PAYLOAD"
