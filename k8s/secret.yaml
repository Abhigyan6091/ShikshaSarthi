# ─── ShikshaSarthi – Secrets ───────────────────────────────────────────────
# Replace placeholder values with your actual credentials.
# For production, use a sealed-secret or external secrets operator.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: shiksha-secrets
  namespace: shiksha
  labels:
    app: shiksha-sarthi
type: Opaque
stringData:
  GEMINI_API_KEY: "your-gemini-api-key-here"
  CLOUDINARY_CLOUD_NAME: "your-cloud-name"
  CLOUDINARY_UPLOAD_PRESET: "your-upload-preset"
